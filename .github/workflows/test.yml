name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 本项目零依赖，不需要 npm install
      - name: 语法检查
        run: |
          for f in server.js js/*.js test/*.js; do
            node --check "$f"
            echo "OK  $f"
          done

      # 用不带参数的 `node --test` 自动发现用例。
      # 不要写成 `node --test test/`：Node 20 能跑，但 Node 22 起会把 `test/`
      # 当成要执行的模块，直接 Cannot find module 退出（本仓库踩过，CI 抓到的）。
      - name: 全部测试（52 条）
        run: node --test
